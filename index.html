<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Postcards</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#3c4f2e;
    --forest-dark:#2b3a20;
    --rose:#cf8798;
    --rose-dark:#b06779;
    --cream:#f6e0c2;
    --cream-dark:#eccfa2;
    --olive:#b8be7c;
    --olive-dark:#9ba362;
    --paper:#fbf5ea;
    --ink:#2c2418;
    --ink-soft:#786c58;
    --line:#e4d6bd;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;color:var(--ink);font-family:'Karla',sans-serif;min-height:100vh;
    background:
      radial-gradient(ellipse 60% 40% at 15% 0%, rgba(184,190,124,.35), transparent 60%),
      radial-gradient(ellipse 55% 45% at 100% 20%, rgba(60,79,46,.4), transparent 60%),
      radial-gradient(ellipse 70% 50% at 50% 100%, rgba(60,79,46,.3), transparent 65%),
      var(--forest-dark);
    background-attachment:fixed;
  }
  .app{max-width:1180px;margin:0 auto;padding:34px 26px 80px;}

  header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:30px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo-lily{width:44px;height:44px;flex:none;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-style:italic;font-size:1.9rem;margin:0;color:var(--paper);line-height:1;}
  .tagline{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#cdd3b8;margin-top:6px;}

  .toolbar{display:flex;gap:10px;align-items:center;}
  .toolbar input[type="text"]{
    font-family:'Karla',sans-serif;font-size:.85rem;padding:10px 15px;border-radius:8px;
    border:1px solid transparent;background:rgba(251,245,234,.12);color:var(--paper);outline:none;width:180px;
  }
  .toolbar input[type="text"]::placeholder{color:#cdd3b8;}
  .toolbar input[type="text"]:focus{background:rgba(251,245,234,.2);}
  .btn{
    font-family:'Karla',sans-serif;font-weight:600;font-size:.82rem;border:none;cursor:pointer;
    padding:10px 18px;border-radius:8px;background:var(--rose);color:#3a1c24;letter-spacing:.02em;
    transition:background .15s ease, transform .15s ease;
  }
  .btn:hover{background:var(--rose-dark);color:var(--paper);}
  .btn.ghost{background:transparent;color:var(--forest);border:1px solid var(--forest);}
  .btn.ghost:hover{background:rgba(60,79,46,.08);}
  .btn.small{padding:8px 14px;font-size:.76rem;}
  .btn.text{background:none;color:#cdd3b8;padding:6px 4px;font-weight:600;}
  .btn.text:hover{color:var(--paper);}

  /* ---------- GRID VIEW: swatch-card postcards ---------- */
  #gridView .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:26px;padding:4px 2px 40px;
  }
  .postcard{cursor:pointer;}
  .swatch{
    border-radius:14px;padding:18px 18px 16px;height:230px;position:relative;overflow:hidden;
    box-shadow:0 10px 24px rgba(20,20,10,.28);
    transition:transform .2s ease, box-shadow .2s ease;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .postcard:hover .swatch{transform:translateY(-5px);box-shadow:0 16px 30px rgba(20,20,10,.34);}
  .swatch .sprig{position:absolute;right:-6%;bottom:-8%;width:78%;height:88%;opacity:.5;}
  .swatch-label{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;position:relative;z-index:1;}
  .swatch-bottom{position:relative;z-index:1;}
  .swatch-title{font-family:'Fraunces',serif;font-weight:500;font-size:1.15rem;line-height:1.2;margin-bottom:5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .swatch-code{font-size:.68rem;letter-spacing:.04em;font-weight:600;opacity:.85;}

  /* postcard with a chosen cover photo: half photo / half mood-colour band */
  .swatch.has-image{padding:0;}
  .cover-photo{flex:0 0 50%;background-size:cover;background-color:#00000010;}
  .cover-band{flex:0 0 50%;display:flex;flex-direction:column;justify-content:center;padding:12px 16px;}
  .cover-band .swatch-title{margin-bottom:3px;-webkit-line-clamp:3;}
  .cover-band .swatch-code{opacity:.85;}

  .new-card .swatch{
    background:transparent;border:1.5px dashed rgba(251,245,234,.4);box-shadow:none;
    align-items:center;justify-content:center;color:#cdd3b8;
  }
  .new-card:hover .swatch{border-color:var(--paper);transform:translateY(-5px);}
  .new-card .plus-wrap{text-align:center;}
  .new-card .plus{font-family:'Fraunces',serif;font-weight:500;font-size:2.1rem;line-height:1;color:var(--paper);}
  .new-card .plus-label{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;margin-top:6px;}

  .empty-state{text-align:center;padding:50px 20px;color:#cdd3b8;grid-column:1/-1;}

  /* ---------- DETAIL VIEW ---------- */
  #detailView{display:none;}
  .back-btn{margin:0 0 16px;}
  .back-card{
    background:var(--paper);border-radius:16px;box-shadow:0 20px 40px rgba(20,20,10,.35);
    display:grid;grid-template-columns:1fr 260px;min-height:470px;overflow:hidden;
  }
  @media (max-width:760px){.back-card{grid-template-columns:1fr;}}

  .back-left{padding:34px 32px 26px;}
  .pc-title-input{
    width:100%;border:none;background:transparent;outline:none;font-family:'Fraunces',serif;
    font-weight:500;font-size:1.6rem;color:var(--forest);margin-bottom:18px;
  }
  .pc-title-input::placeholder{color:#c9bfa8;}

  .editor-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
  .word-count{font-size:.72rem;color:var(--ink-soft);white-space:nowrap;}

  .entry-editor{
    width:100%;min-height:320px;outline:none;
    font-family:'Karla',sans-serif;font-size:1.02rem;line-height:1.9rem;color:var(--ink);
    background-image:repeating-linear-gradient(to bottom, transparent, transparent 1.85rem, var(--line) 1.9rem);
    padding-top:2px;padding-bottom:20px;
  }
  .entry-editor:empty:before{content:attr(data-placeholder);color:#c4b49e;font-style:italic;}
  .entry-editor p{margin:0 0 0 0;}
  .entry-editor img{max-width:100%;}

  /* inline photo grid blocks: up to 3 photos per row */
  .img-grid{display:grid;grid-template-columns:repeat(var(--cols,3), 1fr);gap:6px;margin:10px 0 16px;}
  .img-item{display:block;border:none;padding:0;background:rgba(0,0,0,.06);border-radius:8px;
    overflow:hidden;cursor:zoom-in;aspect-ratio:1/1;}
  .grid-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s ease;}
  .img-item:hover .grid-img{transform:scale(1.05);}

  .back-right{padding:26px 22px;display:flex;flex-direction:column;gap:24px;background:#f2e6d0;
    border-left:1px solid var(--line);overflow-y:auto;}
  @media (max-width:760px){.back-right{border-left:none;border-top:1px solid var(--line);}}

  .section-label{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
    color:var(--ink-soft);margin-bottom:10px;}

  .cover-hint{font-size:.72rem;color:var(--ink-soft);line-height:1.45;}
  .cover-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .cover-thumb{width:42px;height:42px;border-radius:8px;background-size:cover;background-position:center;
    border:2px solid transparent;cursor:pointer;padding:0;}
  .cover-thumb.selected{border-color:var(--forest);box-shadow:0 0 0 2px var(--paper), 0 0 0 4px var(--forest);}

  .cover-position{margin-top:6px;}
  .cover-preview-box{width:100%;aspect-ratio:1.8/1;border-radius:10px;background-size:cover;
    border:1px solid var(--line);margin-bottom:10px;}
  .position-sliders{display:flex;flex-direction:column;gap:10px;}
  .position-sliders label{font-size:.66rem;color:var(--ink-soft);display:flex;flex-direction:column;gap:5px;
    font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
  .position-sliders input[type="range"]{width:100%;accent-color:var(--forest);}

  .mood-swatches{display:flex;flex-direction:column;gap:8px;}
  .mood-swatch{
    display:flex;align-items:center;gap:10px;border:none;background:none;cursor:pointer;padding:6px 8px;
    border-radius:8px;text-align:left;transition:background .15s ease;
  }
  .mood-swatch:hover{background:rgba(60,79,46,.06);}
  .mood-swatch.selected{background:rgba(60,79,46,.1);}
  .mood-swatch .chip{width:26px;height:26px;border-radius:6px;flex:none;border:1.5px solid rgba(0,0,0,.08);}
  .mood-swatch.selected .chip{box-shadow:0 0 0 2px var(--paper), 0 0 0 3.5px var(--forest);}
  .mood-swatch .info{line-height:1.25;}
  .mood-swatch .mname{font-size:.82rem;font-weight:600;color:var(--ink);}

  .date-field{display:flex;flex-direction:column;gap:4px;}
  .date-input{
    font-family:'Karla',sans-serif;font-weight:600;font-size:.86rem;border:none;
    background:transparent;color:var(--ink);outline:none;cursor:pointer;padding:0;
  }

  .back-actions{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding-top:6px;}
  .save-status{font-size:.7rem;color:var(--forest);font-weight:700;opacity:0;transition:opacity .3s ease;display:block;margin-top:6px;text-align:right;}
  .save-status.show{opacity:1;}

  /* ---------- LIGHTBOX ---------- */
  .lightbox{position:fixed;inset:0;background:rgba(20,16,10,.92);display:none;align-items:center;
    justify-content:center;z-index:1000;padding:36px;cursor:zoom-out;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.5);}
  .lightbox-close{position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;
    font-size:2rem;line-height:1;cursor:pointer;}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand-wrap">
      <div class="brand">
        <svg class="logo-lily" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g id="lilyLogo"></g></svg>

</div>

<!-- LIGHTBOX -->

  <button class="lightbox-close" id="lightboxClose">&times;</button>

</div>

<script>
/* If this page is running outside Claude's artifact viewer (e.g. hosted on
   GitHub Pages, or opened as a plain local file), window.storage won't
   exist. This fallback gives it the same get/set/delete/list interface,
   backed by the browser's own localStorage, so entries still save. */
if(!window.storage){
  window.storage = {
    async get(key){
      const v = localStorage.getItem(key);
      if(v===null) throw new Error('Key not found: ' + key);
      return {key, value:v, shared:false};
    },
    async set(key, value){
      localStorage.setItem(key, value);
      return {key, value, shared:false};
    },
    async delete(key){
      localStorage.removeItem(key);
      return {key, deleted:true, shared:false};
    },
    async list(prefix){
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return {keys, prefix, shared:false};
    }
  };
}

/* ---------- painted stargazer-lily logo mark ---------- */
function lilyLogoSVG(){
  const petalLight = '#e8b7c2';
  const petalMid = '#cf8798';
  const petalDeep = '#b06779';
  const stem = '#6b8055';
  const anther = '#c97b4a';
  let petals = '';
  for(let i=0;i<6;i++){
    const ang = i*60;
    petals += `<g transform="rotate(${ang} 50 54)">
      <path d="M50,54 C41,42 37,20 50,6 C63,20 59,42 50,54 Z" fill="${i%2? petalMid : petalLight}"/>
      <path d="M50,54 C46,44 45,26 50,14" stroke="${petalDeep}" stroke-width="0.8" fill="none" opacity=".6"/>
      <ellipse cx="47" cy="34" rx="1.1" ry="1.6" fill="${petalDeep}" opacity=".55"/>
      <ellipse cx="52" cy="40" rx="1" ry="1.4" fill="${petalDeep}" opacity=".5"/>
    </g>`;
  }
  let stamens = '';
  for(let i=0;i<5;i++){
    const ang = -60 + i*30;
    stamens += `<g transform="rotate(${ang} 50 54)">
      <path d="M50,54 C50,44 50,36 50,30" stroke="${stem}" stroke-width="1.1" fill="none"/>
      <ellipse cx="50" cy="28" rx="2.4" ry="1.4" fill="${anther}" transform="rotate(${ang} 50 28)"/>
    </g>`;
  }
  return `${petals}${stamens}<circle cx="50" cy="54" r="2" fill="${stem}"/>`;
}
document.getElementById('lilyLogo').innerHTML = lilyLogoSVG();

/* ---------- mood palette ---------- */
const MOODS = [
  {id:'happy',       label:'Happy',       bg:'#cf8798', ink:'#3a1c24', sprig:'#b06779'},
  {id:'calm',        label:'Calm',        bg:'#b8be7c', ink:'#3c4f2e', sprig:'#9ba362'},
  {id:'neutral',     label:'Neutral',     bg:'#f6e0c2', ink:'#3c4f2e', sprig:'#e0bd8e'},
  {id:'sad',         label:'Sad',         bg:'#3c4f2e', ink:'#f6e0c2', sprig:'#546b40'},
  {id:'overwhelmed', label:'Overwhelmed', bg:'#6e3b42', ink:'#f6e0c2', sprig:'#8a565e'},
];
function moodOf(id){ return MOODS.find(m=>m.id===id) || null; }

/* full stargazer-lily bloom, tone-on-tone with the postcard's mood colour,
   shown when an entry has no cover photo: six splayed recurved petals, a
   radiating throat, and curved stamens with anthers */
function sprigSVG(m){
  const petalFill = 'rgba(255,255,255,0.16)';
  const vein = m.sprig;
  const petalAngles = [-70,-32,4,42,80,118];
  let petals = '';
  petalAngles.forEach((ang,i)=>{
    const len = 46 + (i%2===0? 4:0);
    petals += `<g transform="rotate(${ang} 55 68)">
      <path d="M55,68 C40,54 34,26 55,${68-len} C76,26 70,54 55,68 Z" fill="${petalFill}" stroke="${vein}" stroke-width="0.9" opacity=".9"/>
      <path d="M55,68 C52,52 52,32 55,${68-len+10}" stroke="${vein}" stroke-width="0.7" opacity=".55" fill="none"/>
      <path d="M50,50 C48,40 49,30 51,22" stroke="${vein}" stroke-width="0.4" opacity=".4" fill="none"/>
      <path d="M60,50 C62,40 61,30 59,22" stroke="${vein}" stroke-width="0.4" opacity=".4" fill="none"/>
    </g>`;
  });
  let stamens = '';
  [-46,-20,4,26,50].forEach((ang,i)=>{
    const len = 30 + (i%2)*5;
    stamens += `<g transform="rotate(${ang} 55 68)">
      <path d="M55,68 C55,${68-len*0.5} 53,${68-len*0.85} 51,${68-len}" stroke="${vein}" stroke-width="1" fill="none" opacity=".75"/>
      <ellipse cx="51" cy="${68-len}" rx="2.6" ry="1.6" fill="${vein}" opacity=".85" transform="rotate(${ang*0.6} 51 ${68-len})"/>
    </g>`;
  });
  const rays = Array.from({length:10}).map((_,i)=>{
    const a = (i*36)*Math.PI/180;
    const x2 = 55+16*Math.cos(a), y2 = 68+16*Math.sin(a);
    return `<line x1="55" y1="68" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${vein}" stroke-width="0.6" opacity=".3"/>`;
  }).join('');
  return `<svg viewBox="0 0 110 130" fill="none" xmlns="http://www.w3.org/2000/svg">
    ${petals}
    ${rays}
    ${stamens}
    <circle cx="55" cy="68" r="2.2" fill="${vein}" opacity=".9"/>
  </svg>`;
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDateShort(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return d.textContent || '';
}

/* Shrinks & compresses an uploaded photo before it's stored, so entries
   with several photos stay well under storage limits. */
function compressImage(file, maxDim=1000, quality=0.8){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not load image'));
      img.onload = () => {
        let {width, height} = img;
        if(width > height && width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- lightbox ---------- */
function openLightbox(src){
  lightboxImg.src = src;
  lightbox.classList.add('show');
}
function closeLightbox(){
  lightbox.classList.remove('show');
  lightboxImg.src = '';
}
lightbox.addEventListener('click', closeLightbox);
lightboxClose.addEventListener('click', (e)=>{ e.stopPropagation(); closeLightbox(); });
lightboxImg.addEventListener('click', (e)=> e.stopPropagation());

/* ---------- editor: cursor tracking + inline photo insertion ---------- */
function captureSelection(){
  const sel = window.getSelection();
  if(sel && sel.rangeCount>0){
    const r = sel.getRangeAt(0);
    if(entryText.contains(r.commonAncestorContainer)){ savedRange = r.cloneRange(); return; }
  }
}
function restoreSelection(){
  const sel = window.getSelection();
  sel.removeAllRanges();
  if(savedRange){
    try{ sel.addRange(savedRange); return; }catch(e){ /* fall through */ }
  }
  const r = document.createRange();
  r.selectNodeContents(entryText);
  r.collapse(false);
  sel.addRange(r);
}
entryText.addEventListener('mouseup', captureSelection);
entryText.addEventListener('keyup', captureSelection);

entryText.addEventListener('click', (e)=>{
  const img = e.target.closest('img.grid-img');
  if(img && img.src) openLightbox(img.src);
});

insertPhotosBtn.addEventListener('click', ()=>{
  captureSelection();
  insertImagesInput.click();
});

insertImagesInput.addEventListener('change', async ()=>{
  const files = Array.from(insertImagesInput.files || []);
  if(!files.length) return;
  insertPhotosBtn.disabled = true;
  insertPhotosBtn.textContent = 'Adding photos…';
  const newImgs = [];
  for(const file of files){
    try{
      const src = await compressImage(file);
      const id = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
      newImgs.push({id, src});
      currentImages.push({id, src});
    }catch(err){ console.error('Could not process a photo', err); }
  }
  if(newImgs.length){
    const cols = Math.min(newImgs.length, 3);
    const gridHtml = `<div class="img-grid" contenteditable="false" style="--cols:${cols};">` +
      newImgs.map(im => `<span class="img-item"><img class="grid-img" data-img-id="${im.id}" src="${im.src}" alt=""></span>`).join('') +
      `</div><p><br></p>`;
    entryText.focus();
    restoreSelection();
    document.execCommand('insertHTML', false, gridHtml);
    savedRange = null;
  }
  insertImagesInput.value = '';
  insertPhotosBtn.disabled = false;
  insertPhotosBtn.textContent = '+ Insert photos';
  updateWordCount();
  renderCoverPicker();
});

/* If the person deletes a photo block by editing the text directly, keep
   the image pool and cover selection in sync with what's actually there. */
function syncImagesFromDom(){
  const idsInDom = new Set(Array.from(entryText.querySelectorAll('img[data-img-id]')).map(im => im.dataset.imgId));
  currentImages = currentImages.filter(im => idsInDom.has(im.id));
  if(selectedCoverId && !idsInDom.has(selectedCoverId)){ selectedCoverId = null; }
  renderCoverPicker();
}
entryText.addEventListener('input', ()=>{ updateWordCount(); syncImagesFromDom(); });

function updateWordCount(){
  const words = entryText.innerText.trim().split(/\s+/).filter(Boolean).length;
  wordCount.textContent = words + (words===1 ? ' word' : ' words');
}

/* strips heavy data-URLs out of the saved HTML (images are stored once,
   in currentImages, and re-attached on load) */
function serializeEntryHtml(){
  const clone = entryText.cloneNode(true);
  clone.querySelectorAll('img[data-img-id]').forEach(img => img.removeAttribute('src'));
  return clone.innerHTML;
}

/* ---------- cover picker (choose one of the note's own photos) ---------- */
function renderCoverPicker(){
  if(currentImages.length===0){
    coverPicker.innerHTML = `<div class="cover-hint">Add photos to your note first, then pick one here as the cover.</div>`;
    coverPosBlock.style.display = 'none';
    return;
  }
  coverPicker.innerHTML =
    `<div class="cover-thumbs">` +
    currentImages.map(im => `<button type="button" class="cover-thumb ${selectedCoverId===im.id?'selected':''}" data-cover-id="${im.id}" style="background-image:url('${im.src}');" title="Use as cover"></button>`).join('') +
    `</div><div class="cover-hint">${selectedCoverId ? 'Click the selected photo again to remove it as the cover.' : 'Click a photo to use it as this postcard\\'s cover.'}</div>`;

  coverPicker.querySelectorAll('.cover-thumb').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.coverId;
      if(selectedCoverId === id){
        selectedCoverId = null;
      } else {
        selectedCoverId = id;
        coverPosition = {x:50, y:50};
      }
      renderCoverPicker();
      renderCoverPositionUI();
    });
  });
  renderCoverPositionUI();
}

function renderCoverPositionUI(){
  if(!selectedCoverId){ coverPosBlock.style.display = 'none'; return; }
  const rec = currentImages.find(im => im.id===selectedCoverId);
  if(!rec){ coverPosBlock.style.display = 'none'; return; }
  coverPosBlock.style.display = 'block';
  coverPreviewBox.style.backgroundImage = `url('${rec.src}')`;
  coverPreviewBox.style.backgroundPosition = `${coverPosition.x}% ${coverPosition.y}%`;
  coverXSlider.value = coverPosition.x;
  coverYSlider.value = coverPosition.y;
}
function updateCoverPreviewStyle(){
  coverPreviewBox.style.backgroundPosition = `${coverPosition.x}% ${coverPosition.y}%`;
}
coverXSlider.addEventListener('input', ()=>{ coverPosition.x = Number(coverXSlider.value); updateCoverPreviewStyle(); });
coverYSlider.addEventListener('input', ()=>{ coverPosition.y = Number(coverYSlider.value); updateCoverPreviewStyle(); });

/* ---------- grid rendering (postcard wall) ---------- */
function renderGrid(filter=''){
  const f = filter.trim().toLowerCase();
  const sorted = [...entries].sort((a,b)=> b.date.localeCompare(a.date));
  const filtered = f ? sorted.filter(e =>
    (e.title||'').toLowerCase().includes(f) || stripTags(e.text||'').toLowerCase().includes(f)
  ) : sorted;

  let html = `
    <div class="postcard new-card" id="newCard">
      <div class="swatch">
        <div class="plus-wrap">
          <div class="plus">+</div>
          <div class="plus-label">New postcard</div>
        </div>
      </div>
    </div>`;

  if(filtered.length===0 && f){
    html += `<div class="empty-state">No postcards match "${escapeHtml(filter)}".</div>`;
  } else {
    html += filtered.map(e=>{
      const m = moodOf(e.mood) || MOODS[2];
      let coverSrc = null;
      let pos = e.coverPosition || {x:50, y:50};
      if(e.coverImageId && Array.isArray(e.images)){
        const rec = e.images.find(im => im.id===e.coverImageId);
        if(rec) coverSrc = rec.src;
      }
      if(!coverSrc && e.image){ coverSrc = e.image; pos = {x:50, y:50}; } // legacy single-cover entries

      if(coverSrc){
        return `
        <div class="postcard" data-id="${e.id}">
          <div class="swatch has-image">
            <div class="cover-photo" style="background-image:url('${coverSrc}');background-position:${pos.x}% ${pos.y}%;"></div>
            <div class="cover-band" style="background:${m.bg};color:${m.ink};">
              <div class="swatch-title">${e.title ? escapeHtml(e.title) : 'Untitled page'}</div>
              <div class="swatch-code">${fmtDateShort(e.date)} · ${m.label.toUpperCase()}</div>
            </div>
          </div>
        </div>`;
      }
      return `
      <div class="postcard" data-id="${e.id}">
        <div class="swatch" style="background:${m.bg};color:${m.ink};">
          <div class="sprig">${sprigSVG(m)}</div>
          <div class="swatch-label">Entry — ${fmtDateShort(e.date)}</div>
          <div class="swatch-bottom">
            <div class="swatch-title">${e.title ? escapeHtml(e.title) : 'Untitled page'}</div>
            <div class="swatch-code">${m.label.toUpperCase()}</div>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  gridEl.innerHTML = html;
  el('newCard').addEventListener('click', ()=> openEntry(null));
  gridEl.querySelectorAll('.postcard[data-id]').forEach(card=>{
    card.addEventListener('click', ()=> openEntry(card.dataset.id));
  });
}

/* ---------- mood picker (detail view) ---------- */
function renderMoodSwatches(){
  moodSwatches.innerHTML = MOODS.map(m=>`
    <button class="mood-swatch ${selectedMood===m.id?'selected':''}" data-mood="${m.id}">
      <span class="chip" style="background:${m.bg};"></span>
      <span class="info">
        <span class="mname">${m.label}</span>
      </span>
    </button>
  `).join('');
  moodSwatches.querySelectorAll('.mood-swatch').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedMood = btn.dataset.mood;
      renderMoodSwatches();
    });
  });
}

/* ---------- open / new / save / delete ---------- */
function openEntry(id){
  if(id){
    const e = entries.find(x=>x.id===id);
    if(!e) return;
    currentId = e.id;
    titleInput.value = e.title || '';
    dateInput.value = e.date;
    selectedMood = e.mood || null;
    currentImages = Array.isArray(e.images) ? e.images.map(im => ({...im})) : [];
    entryText.innerHTML = e.text || '';
    entryText.querySelectorAll('img[data-img-id]').forEach(img=>{
      const rec = currentImages.find(x => x.id===img.dataset.imgId);
      if(rec) img.src = rec.src;
    });
    selectedCoverId = e.coverImageId || null;
    coverPosition = e.coverPosition || {x:50, y:50};
    deleteBtn.style.display = 'inline-block';
  } else {
    currentId = null;
    titleInput.value = '';
    dateInput.value = todayStr();
    selectedMood = null;
    currentImages = [];
    entryText.innerHTML = '';
    selectedCoverId = null;
    coverPosition = {x:50, y:50};
    deleteBtn.style.display = 'none';
  }
  renderMoodSwatches();
  renderCoverPicker();
  updateWordCount();
  gridView.style.display = 'none';
  gridToolbar.style.display = 'none';
  detailView.style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

function closeDetail(){
  gridView.style.display = 'block';
  gridToolbar.style.display = 'flex';
  detailView.style.display = 'none';
  renderGrid(searchBox.value);
}

async function saveEntry(){
  const id = currentId || ('entry_' + Date.now());
  const textHtml = serializeEntryHtml();
  const usedIds = new Set(Array.from(entryText.querySelectorAll('img[data-img-id]')).map(im => im.dataset.imgId));
  const imagesToSave = currentImages.filter(im => usedIds.has(im.id));
  const entry = {
    id,
    date: dateInput.value || todayStr(),
    title: titleInput.value,
    text: textHtml,
    images: imagesToSave,
    mood: selectedMood,
    coverImageId: (selectedCoverId && usedIds.has(selectedCoverId)) ? selectedCoverId : null,
    coverPosition: coverPosition,
    updated: new Date().toISOString()
  };
  const idx = entries.findIndex(x=>x.id===id);
  if(idx>=0) entries[idx] = entry; else entries.push(entry);
  currentId = id;

  try{
    await window.storage.set(id, JSON.stringify(entry));
    saveStatus.classList.add('show');
    setTimeout(()=> saveStatus.classList.remove('show'), 1800);
  }catch(err){
    console.error('Save failed', err);
    saveStatus.textContent = '⚠ could not save (try fewer/smaller photos)';
    saveStatus.classList.add('show');
  }
  deleteBtn.style.display = 'inline-block';
}

async function deleteEntry(){
  if(!currentId) return;
  if(!confirm('Delete this postcard? This cannot be undone.')) return;
  try{ await window.storage.delete(currentId); }catch(err){ console.error('Delete failed', err); }
  entries = entries.filter(x=>x.id!==currentId);
  closeDetail();
}

async function loadAllEntries(){
  gridEl.innerHTML = `<div class="empty-state">Gathering your postcards…</div>`;
  try{
    const listResult = await window.storage.list('entry_');
    const keys = (listResult && listResult.keys) || [];
    const loaded = [];
    for(const k of keys){
      try{
        const res = await window.storage.get(k);
        if(res && res.value) loaded.push(JSON.parse(res.value));
      }catch(e){ /* skip */ }
    }
    entries = loaded;
  }catch(err){
    console.error('Could not list entries', err);
    entries = [];
  }
  renderGrid();
}

/* ---------- events ---------- */
el('newEntryBtn').addEventListener('click', ()=> openEntry(null));
el('backBtn').addEventListener('click', closeDetail);
el('saveBtn').addEventListener('click', saveEntry);
el('deleteBtn').addEventListener('click', deleteEntry);
searchBox.addEventListener('input', ()=> renderGrid(searchBox.value));

loadAllEntries();
</script>
</body>
</html>
